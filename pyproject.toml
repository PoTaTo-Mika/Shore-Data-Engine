[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shore-data-engine"
version = "0.1.0"
description = "Config-driven audio annotation pipeline backed by sglang-omni"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "numpy>=1.24",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "tqdm>=4.64.0",
]
local = [
    "numpy>=1.24",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "tqdm>=4.64.0",
    "huggingface-hub",
    "torch",
    "torchaudio",
    "silero-vad",
    "ten-vad",
    "demucs",
]
crawler = [
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9",
    "boto3>=1.34",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]
all = [
    "numpy>=1.24",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "tqdm>=4.64.0",
    "huggingface-hub",
    "torch",
    "torchaudio",
    "silero-vad",
    "ten-vad",
    "demucs",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9",
    "boto3>=1.34",
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.scripts]
shore = "engine.run:main"

[project.urls]
Repository = "https://github.com/PoTaTo-Mika/Shore-Data-Engine"

[tool.uv.sources]
demucs = { path = "third-party/demucs", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["data_process*", "engine", "engine.configs", "tools*", "crawler*"]
namespaces = true

[tool.setuptools.package-data]
"engine.configs" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["engine/sglang-omni", "third-party", "build"]
