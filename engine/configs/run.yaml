data_root: data
output_name: annotations.jsonl
audio_extensions: [.opus, .wav, .mp3, .flac, .m4a, .ogg, .aac]
engine_path: engine/sglang-omni

# Concurrent requests per tar sent to the uvr / slicer backends.
stage_workers: ${SHORE_STAGE_WORKERS:-4}

# Every stage runs against a backend service, started for the stage and stopped after it.
# uvr / slicer backends are the stage dispatch servers; the ASR model supplies its command.
# Drop an ASR model's command to attach to an already running server.
services:
  uvr:
    base_url: ${UVR_BASE_URL:-http://127.0.0.1:8001}
    health_path: /health
    startup_timeout_s: 600
    timeout_s: 600
    retry: {max_attempts: 3, backoff_s: 1.0, status_codes: [502, 503, 504]}
  vad:
    base_url: ${VAD_BASE_URL:-http://127.0.0.1:8002}
    health_path: /health
    startup_timeout_s: 300
    timeout_s: 300
    retry: {max_attempts: 3, backoff_s: 1.0, status_codes: [502, 503, 504]}
  omni:
    base_url: ${OMNI_BASE_URL:-http://127.0.0.1:8000}
    api_key_env: OMNI_API_KEY
    health_path: /health
    startup_timeout_s: 900
    timeout_s: 120
    retry:
      max_attempts: 5
      backoff_s: 1.0
      status_codes: [429, 500, 502, 503, 504]

# Pick a model per stage with stages[].model or `--model <key>` (repeatable).
models:
  # uvr: served by data_process.uvr.dispatch at /v1/audio/separations.
  demucs: {operator: demucs, params: {model: htdemucs}}
  # MDX-Net ONNX weights are downloaded from repo_id when model_path is missing.
  # n_fft / dim_f / dim_t / compensate are per-checkpoint; these match Kim_Vocal_2.
  mdx_net:
    operator: mdx_net
    params:
      model_path: checkpoints/Kim_Vocal_2.onnx
      repo_id: seanghay/uvr_models
      stem: vocals
      n_fft: 7680
      dim_f: 3072
      dim_t: 256
      compensate: 1.009

  # slicer: served by data_process.vad.dispatch at /v1/audio/segments.
  rms_vad: {operator: rms_vad, params: {threshold: -30.0, min_length: 10000}}
  silero_vad: {operator: silero_vad, params: {threshold: 0.6, min_silence_ms: 500, target_s: 15.0, max_s: 20.0}}
  ten_vad: {operator: ten_vad, params: {threshold: 0.5, min_speech_ms: 300, min_silence_ms: 200}}

  # asr: plain multipart /v1/audio/transcriptions with response_format=json.
  # Checkpoints present in checkpoints/ are referenced by local path; the rest
  # use their HuggingFace repo id and are fetched by sglang-omni on first use.
  qwen3_asr:
    model: Qwen/Qwen3-ASR-1.7B
    params: {language: zh, response_format: json}
    command: [sgl-omni, serve, --model-path, checkpoints/Qwen3-ASR-1.7B, --model-name, Qwen/Qwen3-ASR-1.7B, --port, "8000"]
  fun_asr_nano:
    model: FunAudioLLM/Fun-ASR-Nano-2512-hf
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, FunAudioLLM/Fun-ASR-Nano-2512-hf, --port, "8000"]
  ark_asr:
    model: AutoArk-AI/ARK-ASR-3B
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, AutoArk-AI/ARK-ASR-3B, --port, "8000"]
  nemotron_3_5_asr:
    model: nvidia/nemotron-3.5-asr-streaming-0.6b
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, nvidia/nemotron-3.5-asr-streaming-0.6b, --port, "8000"]
  nemotron_transcribe:
    model: nemotron-transcribe
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, nvidia/Nemotron-3.5-Transcribe-30B-A4B, --model-name, nemotron-transcribe, --mem-fraction-static, "0.85", --port, "8000"]
  ming3_asr:
    model: inclusionAI/Ming-3.0-asr-tiny
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, inclusionAI/Ming-3.0-asr-tiny, --port, "8000"]
  whisper_large_v3:
    model: openai/whisper-large-v3
    params: {response_format: json}
    # Small capture set keeps cold start under the server's 600s readiness limit.
    command: [sgl-omni, serve, --model-path, checkpoints/whisper-large-v3, --model-name, openai/whisper-large-v3, --asr.engine.max_running_requests, "2", --asr.engine.cuda_graph_max_bs, "2", --port, "8000"]
  moss_td:
    model: OpenMOSS-Team/MOSS-Transcribe-Diarize
    params: {response_format: json}
    command: [sgl-omni, serve, --model-path, checkpoints/MOSS-Transcribe-Diarize, --model-name, OpenMOSS-Team/MOSS-Transcribe-Diarize, --asr.engine.max_running_requests, "4", --asr.engine.cuda_graph_max_bs, "4", --mem-fraction-static, "0.80", --port, "8000"]

# stage1 UVR, stage2 Slicer, stage3 ASR; each stage covers all tars before the next.
stages:
  - {name: stage1, task: uvr, service: uvr, model: demucs}
  - {name: stage2, task: slicer, service: vad, model: rms_vad}
  - {name: stage3, task: asr, service: omni, model: qwen3_asr}
