# Single source of truth for the tar-based annotation pipeline.
data_root: data
output_name: annotations.jsonl
audio_extensions: [.opus, .wav, .mp3, .flac, .m4a, .ogg, .aac]
engine_path: engine/sglang-omni

# Services are launched in this order; remove command to attach to a running one.
services:
  omni:
    command: [sgl-omni, serve, --model-path, Qwen/Qwen3-ASR-1.7B, --port, "8000"]
    base_url: ${OMNI_BASE_URL:-http://127.0.0.1:8000}
    api_key_env: OMNI_API_KEY
    health_path: /health
    startup_timeout_s: 300
    timeout_s: 120
    retry:
      max_attempts: 5
      backoff_s: 1.0
      status_codes: [429, 500, 502, 503, 504]

models:
  demucs:
    params: {model: htdemucs}
  rms_vad:
    params: {threshold: -30.0, min_length: 10000}
  qwen3_asr:
    model: Qwen/Qwen3-ASR-1.7B
    endpoint: /v1/audio/transcriptions
    transport: multipart
    params: {language: zh, response_format: json}

# stage1 UVR, stage2 Slicer, stage3 ASR; each tar finishes all stages serially.
stages:
  - {name: stage1, task: uvr, model: demucs}
  - {name: stage2, task: slicer, model: rms_vad}
  - {name: stage3, task: asr, service: omni, model: qwen3_asr}
